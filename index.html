<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Town - Ciales, PR | Edición Navideña</title>
  <style>
    :root {
      --bg-dark: #0f0f11;
      --card-bg: #1a1a1e;
      --primary-red: #d32f2f;
      --accent-gold: #ffb300;
      --text-light: #f5f5f7;
      --text-muted: #a1a1a6;
      --green-leaf: #2e7d32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); padding-bottom: 80px; }
    
    header {
      background: linear-gradient(180deg, rgba(211,47,47,0.2) 0%, rgba(15,15,17,1) 100%);
      text-align: center;
      padding: 30px 15px;
      position: relative;
    }
    
    .logo-container {
      width: 220px;
      height: 220px;
      margin: 0 auto 15px auto;
    }
    
    .logo-container svg { width: 100%; height: 100%; }

    h1 { font-size: 2rem; color: var(--accent-gold); margin-bottom: 5px; }
    p.subtitle { color: var(--text-muted); font-size: 1.1rem; }
    
    .info-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    .badge {
      background: var(--card-bg);
      border: 1px solid var(--accent-gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--accent-gold);
    }

    .container { max-width: 900px; margin: 0 auto; padding: 20px; }

    .section-title {
      font-size: 1.5rem;
      margin: 30px 0 15px 0;
      color: var(--accent-gold);
      border-bottom: 2px solid var(--primary-red);
      padding-bottom: 5px;
    }

    .grid-sizes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      border: 1px solid #333;
      cursor: pointer;
      transition: 0.2s;
    }
    .card:hover { border-color: var(--accent-gold); transform: translateY(-3px); }
    .card h3 { font-size: 1.1rem; margin-bottom: 5px; }
    .card .price { color: var(--accent-gold); font-weight: bold; font-size: 1.2rem; }

    .ingredients-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }
    .ing-btn {
      background: #25252b;
      border: 1px solid #444;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      user-select: none;
    }
    .ing-btn.selected {
      background: var(--primary-red);
      border-color: var(--accent-gold);
      font-weight: bold;
    }

    .order-summary-box {
      background: var(--card-bg);
      border: 2px dashed var(--accent-gold);
      border-radius: 12px;
      padding: 20px;
      margin-top: 30px;
    }
    .order-summary-box h2 { color: var(--accent-gold); margin-bottom: 10px; }
    
    .btn-whatsapp {
      display: block;
      width: 100%;
      background: #25d366;
      color: #fff;
      font-weight: bold;
      font-size: 1.2rem;
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 15px;
      border: none;
      cursor: pointer;
    }

    .location-btn {
      display: inline-block;
      background: var(--primary-red);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
